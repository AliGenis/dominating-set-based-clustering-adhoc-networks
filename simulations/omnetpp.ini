[General]
network = MyManet
sim-time-limit = 200s
cmdenv-express-mode = true

**.cmdenv-log-level = warn
*.host[*].app[0].cmdenv-log-level = detail
*.host[*].routingApp.cmdenv-log-level = error

*.host[*].app[0].display-name = "DS-Agent"

ned-path = ../src

*.numHosts = 30
*.configurator.config = xml("<config><interface hosts='**' address='10.0.0.x' netmask='255.255.255.0'/></config>")

*.areaWidth = 500m
*.areaHeight = 500m

*.radioMedium.typename = "Ieee80211ScalarRadioMedium"

*.radioMedium.pathLoss.typename = "FreeSpacePathLoss"
*.radioMedium.pathLoss.physicalEnvironmentModule = "physicalEnvironment"

*.radioMedium.pathLoss.k = 8dB

*.radioMedium.pathLoss.l01 = 1
*.radioMedium.pathLoss.l02 = 1
*.radioMedium.pathLoss.alpha1 = 2
*.radioMedium.pathLoss.alpha2 = 4
*.radioMedium.pathLoss.breakpointDistance = 100m

*.radioMedium.pathLoss.transmitterAntennaHeight = 30m
*.radioMedium.pathLoss.receiverAntennaHeight = 1.5m

*.radioMedium.obstacleLoss.typename = ""
*.radioMedium.obstacleLoss.enableDielectricLoss = true
*.radioMedium.obstacleLoss.enableReflectionLoss = true

*.physicalEnvironment.spaceMinX = 0m
*.physicalEnvironment.spaceMinY = 0m
*.physicalEnvironment.spaceMinZ = -1000m
*.physicalEnvironment.spaceMaxX = 500m
*.physicalEnvironment.spaceMaxY = 500m
*.physicalEnvironment.spaceMaxZ = 1000m

*.host[*].wlan[0].radio.typename = "Ieee80211ScalarRadio"

*.host[*].wlan[0].radio.transmitter.power = 1mW
*.host[*].wlan[0].radio.receiver.sensitivity = -85dBm
*.host[*].wlan[0].radio.receiver.snirThreshold = 4dB

*.host[*].wlan[0].mac.typename = "Ieee80211Mac"

*.host[*].wlan[0].mac.dcf.typename = "Dcf"
*.host[*].wlan[0].mac.qosStation = false
*.host[*].wlan[0].mac.modeSet = "g(mixed)"

*.host[*].wlan[0].mac.slotDuration = 0.1s
*.host[*].wlan[0].mac.checkInterval = 0.01s
*.host[*].wlan[0].mac.bitrate = 19200bps
*.host[*].wlan[0].mac.useMACAcks = false

*.host[*].wlan[0].mac.txPower = 50mW

*.host[*].wlan[0].mac.numSlots = 64
*.host[*].wlan[0].mac.reservedMobileSlots = 2

*.host[*].numWlanInterfaces = 1

*.host[*].routingApp.typename = "inet.routing.aodv.Aodv"
*.host[*].routing.typename = ""

*.host[*].mobility.typename = "RandomWaypointMobility"
*.host[*].mobility.initFromDisplayString = false
*.host[*].mobility.initialX = uniform(0m, 500m)
*.host[*].mobility.initialY = uniform(0m, 500m)
*.host[*].mobility.initialZ = 0m

*.host[*].mobility.numHosts = 30
*.host[*].mobility.marginX = 50m
*.host[*].mobility.marginY = 50m
*.host[*].mobility.columns = -1
*.host[*].mobility.rows = -1
*.host[*].mobility.separationX = -1
*.host[*].mobility.separationY = -1

*.host[*].mobility.separation = 50m
*.host[*].mobility.orientation = 0deg

*.host[*].mobility.distance = 100m

*.host[*].mobility.speed = 5mps
*.host[*].mobility.constraintAreaMinX = 0m
*.host[*].mobility.constraintAreaMinY = 0m
*.host[*].mobility.constraintAreaMaxX = 500m
*.host[*].mobility.constraintAreaMaxY = 500m
*.host[*].mobility.constraintAreaMinZ = 0m
*.host[*].mobility.constraintAreaMaxZ = 0m

*.host[*].mobility.changeInterval = 5s
*.host[*].mobility.changeAngleBy = uniform(-180deg, 180deg)
*.host[*].mobility.waitTime = uniform(0s, 1s)

# LinearMobility
*.host[*].mobility.initialMovementHeading = 0deg

# CircleMobility
*.host[*].mobility.cx = 250m
*.host[*].mobility.cy = 250m
*.host[*].mobility.r = 150m
*.host[*].mobility.startAngle = uniform(0deg, 360deg)

# GaussMarkovMobility
*.host[*].mobility.alpha = 0.5
*.host[*].mobility.margin = 30m

# TurtleMobility
*.host[*].mobility.turtleScript = ""

# FacingMobility
*.host[*].mobility.sourceMobility = "."
*.host[*].mobility.targetMobility = ""

# BonnMotionMobility (requires trace file)
*.host[*].mobility.traceFile = ""
*.host[*].mobility.is3D = false
*.host[*].mobility.nodeId = -1

*.host[*].hasStatus = true
*.host[*].status.typename = "NodeStatus"
*.host[*].energyStorage.typename = "SimpleEpEnergyStorage"
*.host[*].energyStorage.nodeStatusModule = "^.status"
*.host[*].energyStorage.initialCapacity = 100J
*.host[*].energyStorage.nominalCapacity = 100J
 

*.host[*].wlan[0].radio.energyConsumer.typename = "StateBasedEpEnergyConsumer"
*.host[*].wlan[0].radio.energyConsumer.energySourceModule = "^.^.^.energyStorage"
*.host[*].wlan[0].radio.energyConsumer.offPowerConsumption = 0W
*.host[*].wlan[0].radio.energyConsumer.sleepPowerConsumption = 0.001W
*.host[*].wlan[0].radio.energyConsumer.switchingPowerConsumption = 0.01W
*.host[*].wlan[0].radio.energyConsumer.receiverIdlePowerConsumption = 0.1W
*.host[*].wlan[0].radio.energyConsumer.receiverBusyPowerConsumption = 0.2W
*.host[*].wlan[0].radio.energyConsumer.receiverReceivingPowerConsumption = 0.3W
*.host[*].wlan[0].radio.energyConsumer.transmitterIdlePowerConsumption = 0.1W
*.host[*].wlan[0].radio.energyConsumer.transmitterTransmittingPowerConsumption = 0.5W

*.host[*].ipv4.configurator.networkConfiguratorModule = "configurator"

*.host[*].numApps = 3

*.host[*].app[0].typename = "DominatingSetAgent"
*.host[*].app[0].helloInterval = 1s
*.host[*].app[0].algorithmInterval = 5s
*.host[*].app[0].statInterval = 10s
*.host[*].app[0].neighborPurgeTimeout = 10s
*.host[*].app[0].localPort = 5000
*.host[*].app[0].destPort = 5000

*.host[*].app[1].typename = "UdpBasicApp"

*.host[0..4].app[1].destAddresses = "host[15]"
*.host[5..9].app[1].destAddresses = "host[16]"
*.host[10..14].app[1].destAddresses = "host[17]"
*.host[15..19].app[1].destAddresses = "host[0]"
*.host[*].app[1].destPort = 5001
*.host[*].app[1].localPort = -1
*.host[*].app[1].messageLength = 512B
*.host[*].app[1].sendInterval = 1s
*.host[*].app[1].startTime = 30s
*.host[*].app[1].stopTime = -1s

*.host[*].app[2].typename = "UdpSink"
*.host[*].app[2].localPort = 5001


#*.host[*].app[1].typename = "PingApp"
