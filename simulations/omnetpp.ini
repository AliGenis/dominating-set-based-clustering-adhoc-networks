[General]
network = MyManet
sim-time-limit = ${simTimeLimit=2000s}

ned-path = ../src

*.numHosts = ${numHosts=25}
*.configurator.config = xml("<config><interface hosts='**' address='10.0.0.x' netmask='255.255.255.0'/></config>")

*.areaWidth = ${areaWidth=5000m}
*.areaHeight = ${areaHeight=5000m}

# PHY------------------
*.radioMedium.typename = ${radioType="Ieee80211ScalarRadioMedium"}
*.radioMedium.pathLoss.typename = ${pathLossType="FreeSpacePathLoss"} == "TwoRayGroundReflection" ? "inet.physicallayer.wireless.common.pathloss.TwoRayGroundReflection" : \
                                   (${pathLossType} == "RicianFading" ? "inet.physicallayer.wireless.common.pathloss.RicianFading" : \
                                   (${pathLossType} == "RayleighFading" ? "inet.physicallayer.wireless.common.pathloss.RayleighFading" : \
                                   (${pathLossType} == "BreakpointPathLoss" ? "inet.physicallayer.wireless.common.pathloss.BreakpointPathLoss" : \
                                   (${pathLossType} == "SuiPathLoss" ? "inet.physicallayer.wireless.common.pathloss.SuiPathLoss" : \
                                   "inet.physicallayer.wireless.common.pathloss.FreeSpacePathLoss"))))

# TwoRayGroundReflection
*.radioMedium.pathLoss.physicalEnvironmentModule = "physicalEnvironment"

# RicianFading
*.radioMedium.pathLoss.k = ${ricianK=8dB}

# BreakpointPathLoss
*.radioMedium.pathLoss.l01 = ${breakpointL01=1}
*.radioMedium.pathLoss.l02 = ${breakpointL02=1}
*.radioMedium.pathLoss.alpha1 = ${breakpointAlpha1=2}
*.radioMedium.pathLoss.alpha2 = ${breakpointAlpha2=4}
*.radioMedium.pathLoss.breakpointDistance = ${breakpointDistance=50m}

# SuiPathLoss
*.radioMedium.pathLoss.transmitterAntennaHeight = ${suiTxHeight=30m}
*.radioMedium.pathLoss.receiverAntennaHeight = ${suiRxHeight=1.5m}

# radio conf
*.host[*].wlan[0].radio.typename = ${radioType} == "Ieee80211ScalarRadioMedium" ? "Ieee80211ScalarRadio" : \
                                   (${radioType} == "Ieee80211DimensionalRadioMedium" ? "Ieee80211DimensionalRadio" : \
                                   (${radioType} == "UnitDiskRadioMedium" ? "UnitDiskRadio" : \
                                   (${radioType} == "ApskScalarRadioMedium" ? "ApskScalarRadio" : "Ieee80211ScalarRadio")))

*.host[*].wlan[0].radio.transmitter.power = ${txPower=1mW}
*.host[*].wlan[0].radio.receiver.sensitivity = ${rxSensitivity=-85dBm}
*.host[*].wlan[0].radio.receiver.snirThreshold = ${snirThreshold=4dB}

# MAC----------------------------------
*.host[*].wlan[0].mac.typename = ${macProtocolType="Ieee80211Mac"} == "BMac" ? "inet.linklayer.bmac.BMac" : \
                                  (${macProtocolType} == "XMac" ? "inet.linklayer.xmac.XMac" : \
                                  (${macProtocolType} == "LMac" ? "inet.linklayer.lmac.LMac" : \
                                  "inet.linklayer.ieee80211.mac.Ieee80211Mac"))

# For ieee80211mac
# DCF (Distributed Coordination Function)implements CSMA/CA/ACK
*.host[*].wlan[0].mac.dcf.typename = "Dcf"
*.host[*].wlan[0].mac.modeSet = ${ieee80211ModeSet="g(mixed)"}

# BMAC parameters (when macProtocolType = "BMac")
*.host[*].wlan[0].mac.slotDuration = ${bmacSlotDuration=0.1s}
*.host[*].wlan[0].mac.checkInterval = ${bmacCheckInterval=0.01s}
*.host[*].wlan[0].mac.bitrate = ${bmacBitrate=19200bps}
*.host[*].wlan[0].mac.useMACAcks = ${bmacUseAcks=false}

# XMAC parameters (when macProtocolType = "XMac")
*.host[*].wlan[0].mac.slotDuration = ${xmacSlotDuration=1s}
*.host[*].wlan[0].mac.checkInterval = ${xmacCheckInterval=0.01s}
*.host[*].wlan[0].mac.bitrate = ${xmacBitrate=19200bps}
*.host[*].wlan[0].mac.txPower = ${xmacTxPower=50mW}
*.host[*].wlan[0].mac.useMACAcks = ${xmacUseAcks=false}

# LMAC parameters (when macProtocolType = "LMac")
*.host[*].wlan[0].mac.slotDuration = ${lmacSlotDuration=100ms}
*.host[*].wlan[0].mac.bitrate = ${lmacBitrate=19200bps}
*.host[*].wlan[0].mac.numSlots = ${lmacNumSlots=64}
*.host[*].wlan[0].mac.reservedMobileSlots = ${lmacReservedMobileSlots=2}

*.host[*].numWlanInterfaces = 1

# Routing
#*.host[*].routingApp.typename = "myAodv.MyAodv"
*.host[*].ipv4.routingProtocol.typename = "myAodv.MyAodv"

# Topology
*.host[*].mobility.typename = ${topologyType="Random"} == "Grid" ? "StaticGridMobility" : \
                              (${topologyType} == "Chain" ? "StaticLinearMobility" : \
                              (${topologyType} == "Concentric" ? "StaticConcentricMobility" : \
                              (${mobilityType="RandomWaypointMobility"} == "TurtleMobility" ? "inet.mobility.single.TurtleMobility" : \
                              (${mobilityType} == "FacingMobility" ? "inet.mobility.single.FacingMobility" : \
                              (${mobilityType} == "BonnMotionMobility" ? "inet.mobility.single.BonnMotionMobility" : \
                              ${mobilityType})))))

# Random
*.host[*].mobility.initFromDisplayString = false
*.host[*].mobility.initialX = uniform(0m, ${areaWidth})
*.host[*].mobility.initialY = uniform(0m, ${areaHeight})
*.host[*].mobility.initialZ = 0m

# Grid
*.host[*].mobility.numHosts = ${numHosts}
*.host[*].mobility.marginX = ${gridMarginX=200m}
*.host[*].mobility.marginY = ${gridMarginY=200m}
*.host[*].mobility.columns = ${gridColumns=8}
*.host[*].mobility.rows = ${gridRows=8}

# Chain
*.host[*].mobility.separation = ${chainSeparation=50m}
*.host[*].mobility.orientation = ${chainOrientation=0deg}

# Concentric(star) topology
*.host[*].mobility.distance = ${concentricDistance=100m}

# if topology is random
*.host[*].mobility.speed = ${mobilitySpeed=50mps}
*.host[*].mobility.constraintAreaMinX = 0m
*.host[*].mobility.constraintAreaMinY = 0m
*.host[*].mobility.constraintAreaMaxX = ${areaWidth}
*.host[*].mobility.constraintAreaMaxY = ${areaHeight}
*.host[*].mobility.constraintAreaMinZ = 0m
*.host[*].mobility.constraintAreaMaxZ = 0m

# RandomWaypointMobility
*.host[*].mobility.changeInterval = ${mobilityChangeInterval=5s}
*.host[*].mobility.changeAngleBy = ${mobilityChangeAngle=uniform(-180deg, 180deg)}
*.host[*].mobility.waitTime = ${mobilityPauseTime=uniform(0s, 1s)}

# LinearMobility
*.host[*].mobility.initialMovementHeading = ${linearHeading=0deg}

# CircleMobility
# Center circle in the middle of the area
*.host[*].mobility.cx = ${circleX=${areaWidth}/2}
*.host[*].mobility.cy = ${circleY=${areaHeight}/2}
*.host[*].mobility.r = ${circleR=${areaHeight}/4}
*.host[*].mobility.startAngle = uniform(0deg, 360deg)

# GaussMarkovMobility
*.host[*].mobility.alpha = ${gmAlpha=0.5}
*.host[*].mobility.margin = ${gmMargin=30m}

# MassMobility



# TurtleMobility
#*.host[*].mobility.turtleScript = ${turtleScript=""}

# FacingMobility
*.host[*].mobility.sourceMobility = ${facingSourceMobility="."}
*.host[*].mobility.targetMobility = ${facingTargetMobility=""}

# BonnMotionMobility (requires trace file)
#*.host[*].mobility.traceFile = ${bonnMotionTraceFile=""}
#*.host[*].mobility.is3D = ${bonnMotion3D=false}
#*.host[*].mobility.nodeId = ${bonnMotionNodeId=-1}

# APP
*.host[*].ipv4.configurator.networkConfiguratorModule = "configurator"

# Number of applications per node
# Min 2 ds-clustering + 1 app, for multi app do it 3
*.host[*].numApps = ${numApps=2}

*.host[*].app[0].typename = "DominatingSetAgent"
*.host[*].app[0].helloInterval = ${helloInterval=1s}
*.host[*].app[0].algorithmInterval = ${algorithmInterval=5s}
*.host[*].app[0].neighborPurgeTimeout = ${neighborPurgeTimeout=10s}
*.host[*].app[0].localPort = ${localPort=5000}
*.host[*].app[0].destPort = ${destPort=5000}
*.host[*].app[0].interfaceTableModule = "^.interfaceTable"

*.host[*].app[1].typename = ${trafficAppType="PingApp"}

*.host[*].app[1].destAddr = ${pingDestAddr="*"}
*.host[*].app[1].packetSize = ${pingPacketSize=2000B}
*.host[*].app[1].count = ${pingCount=-1}
*.host[*].app[1].sleepDuration = ${pingSleepDuration=1s}
*.host[*].app[1].startTime = ${trafficStartTime=30s}
*.host[*].app[1].stopTime = ${trafficStopTime=-1s}
*.host[*].app[1].continuous = ${pingContinuous=true}

# UdpBasicApp
# *.host[*].app[1].localPort = ${trafficLocalPort=5001}
# *.host[*].app[1].destPort = ${trafficDestPort=5001}
# *.host[*].app[1].messageLength = ${packetSize=2000B}
# *.host[*].app[1].sendInterval = ${packetInterval=exponential(2s)}
# *.host[*].app[1].startTime = ${trafficStartTime=30s}
# *.host[*].app[1].stopTime = ${trafficStopTime=-1s}
# *.host[*].app[1].destAddresses = "255.255.255.255"

# TcpBasicClientApp
*.host[*].app[1].connectAddress = ${tcpConnectAddress=""}
*.host[*].app[1].connectPort = ${tcpConnectPort=1000}
*.host[*].app[1].requestLength = ${tcpRequestLength=200B}
*.host[*].app[1].replyLength = ${tcpReplyLength=1MiB}
*.host[*].app[1].startTime = ${tcpStartTime=15s}
*.host[*].app[1].stopTime = ${tcp2StopTime=-1s}

# TcpBasicClientApp
*.host[*].app[2].typename = ${trafficApp2Type="TcpBasicClientApp"}
*.host[*].app[2].connectAddress = ${tcp2ConnectAddress=""}
*.host[*].app[2].connectPort = ${tcp2ConnectPort=1001}
*.host[*].app[2].requestLength = ${tcp2RequestLength=200B}
*.host[*].app[2].replyLength = ${tcp2ReplyLength=1MiB}
*.host[*].app[2].startTime = ${traffic2StartTime=15s}
*.host[*].app[2].stopTime = ${traffic2StopTime=-1s}

# results
**.scalar-recording = true
**.vector-recording = true

result-dir = results
output-scalar-file = ${resultdir}/General.sca
output-vector-file = ${resultdir}/General.vec
eventlog-file = ${resultdir}/General.elog
snapshot-file = ${resultdir}/snapshot.sna

*.repeat = ${numRuns=1}
