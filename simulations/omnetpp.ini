# *.host[*].app[1].destAddresses = "255.255.255.255"  # Broadcast address

*.host[*].app[1].connectAddress = ""
*.host[*].app[1].connectPort = 1000
*.host[*].app[1].requestLength = 200B
*.host[*].app[1].replyLength = 1MiB
*.host[*].app[1].numRequestsPerSession = 1
*.host[*].app[1].thinkTime = 0s
*.host[*].app[1].idleInterval = exponential(10s)

#*.host[*].app[3].typename = ${trafficApp2Type="TcpBasicClientApp"}
#*.host[*].app[3].connectAddress = ${tcp2ConnectAddress=""}
#*.host[*].app[3].connectPort = ${tcp2ConnectPort=1001}
#*.host[*].app[3].requestLength = ${tcp2RequestLength=200B}
#*.host[*].app[3].replyLength = ${tcp2ReplyLength=1MiB}
#*.host[*].app[3].startTime = ${traffic2StartTime=15s}
#*.host[*].app[3].stopTime = ${traffic2StopTime=-1s}

# results
**.scalar-recording = true
**.vector-recording = false

result-dir = results
output-scalar-file = ${resultdir}/${configname}.sca
output-vector-file = ${resultdir}/${configname}.vec
eventlog-file = ${resultdir}/${configname}.elog
snapshot-file = ${resultdir}/${configname}.sna
cmdenv-output-file = ${resultdir}/${configname}.out

fname-append-host = false

*.repeat = 1
